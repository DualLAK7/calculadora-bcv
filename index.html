<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora BCV - Halloween Edition</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            display: flex; 
            justify-content: center; 
            padding: 20px;
            color: #e0e0e0;
        }
        .app-container { 
            background: #1e1e24; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
            transition: all 0.3s ease;
        }
        h2 { 
            margin-top: 0; 
            color: #ff9d00; 
            text-align: center; 
            text-shadow: 1px 1px 5px rgba(255, 157, 0, 0.3);
        }
        .tasas-caja { 
            background: #2a2a35; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center;
            border: 1px solid #444;
        }
        label { 
            font-weight: bold; 
            color: #aaa; 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 5px; 
            font-size: 0.95em; 
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            background-color: #2c2c36;
            color: #fff;
            border: 1px solid #555; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff9d00;
        }
        
        /* Tema Multiplicar */
        .tema-multiplicar .select-destacado {
            background-color: #3e2713;
            border-color: #d35400;
            color: #ffb84d;
        }
        .tema-multiplicar .btn-calcular { 
            background-color: #d35400; 
            color: white; 
            border: none; 
            margin-top: 20px; 
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 10px rgba(211, 84, 0, 0.4);
        }
        .tema-multiplicar .btn-calcular:hover { background-color: #e67e22; box-shadow: 0 0 15px rgba(230, 126, 34, 0.6); }
        .tema-multiplicar #lista-historial li { border-left: 4px solid #d35400; }

        /* Tema Dividir */
        .tema-dividir .select-destacado {
            background-color: #2c1a40;
            border-color: #8e44ad;
            color: #d7bde2;
        }
        .tema-dividir .btn-calcular { 
            background-color: #8e44ad; 
            color: white; 
            border: none; 
            margin-top: 20px; 
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 10px rgba(142, 68, 173, 0.4);
        }
        .tema-dividir .btn-calcular:hover { background-color: #9b59b6; box-shadow: 0 0 15px rgba(155, 89, 182, 0.6); }
        .tema-dividir #lista-historial li { border-left: 4px solid #8e44ad; }

        .resultado-caja { 
            margin-top: 20px; 
            padding: 15px; 
            background: #111; 
            color: #ff9d00; 
            border-radius: 8px; 
            border: 1px solid #333;
            text-align: center; 
            font-size: 1.5em; 
            font-weight: bold;
        }
        .equivalencias-caja {
            margin-top: 15px;
            font-size: 0.65em; 
            color: #bbb;
            background: #222;
            padding: 10px;
            border-radius: 6px;
            display: none; 
            text-align: left;
            font-weight: normal;
        }
        .equivalencias-caja b { color: #ff9d00; }
        
        .historial-caja {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .historial-caja h3 {
            margin-top: 0;
            font-size: 1.1em;
            color: #ddd;
            text-align: center;
        }
        #lista-historial {
            list-style-type: none;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        #lista-historial li {
            background: #2a2a35;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.9em;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }
        .btn-limpiar {
            background-color: #555;
            color: white;
            border: none;
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
        }
        .btn-limpiar:hover { background-color: #777; }
        
        /* Firma de Autor */
        .credito {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 0.72em;
            color: #777;
            letter-spacing: 0.6px;
            user-select: none;
        }
        .credito span {
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #d35400, #8e44ad, #d35400);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: brilloCredito 4s linear infinite;
        }
        @keyframes brilloCredito {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
    </style>
</head>
<body>

    <div id="app-container" class="app-container tema-multiplicar">
        <h2>🎃 Calculadora BCV 🦇</h2>
        
        <div class="tasas-caja" id="tasas-info">
            Cargando tasas del BCV...
        </div>

        <label for="modo-calculo">Tipo de Operación:</label>
        <select id="modo-calculo" class="select-destacado" onchange="actualizarInterfaz()">
            <option value="multiplicar">Convertir Divisas a Bolívares (x)</option>
            <option value="dividir">Convertir Bolívares a Divisas (÷)</option>
        </select>

        <div id="contenedor-selector-tasa">
            <label for="tipo-tasa">Seleccione la tasa a usar:</label>
            <select id="tipo-tasa" onchange="gestionarTasaPersonalizada()">
                <option value="usd">Dólar Oficial (BCV)</option>
                <option value="eur">Euro Oficial (BCV)</option>
                <option value="custom">Tasa Personalizada</option>
            </select>
        </div>

        <div id="contenedor-custom" style="display: none;">
            <label for="tasa-custom" id="label-custom">Ingrese su tasa (VES):</label>
            <input type="number" id="tasa-custom" step="0.0001" placeholder="Ej: 36.50">
        </div>

        <label for="monto" id="label-monto">Monto a calcular:</label>
        <input type="number" id="monto" step="0.01" placeholder="Ingrese la cantidad">

        <button class="btn-calcular" id="btn-calcular" onclick="calcularTotal()">Calcular Bolívares</button>

        <div class="resultado-caja">
            <span id="resultado">0,00 VES</span>
            <div id="equivalencias" class="equivalencias-caja"></div>
        </div>

        <div class="historial-caja">
            <h3>Historial de Cálculos</h3>
            <ul id="lista-historial"></ul>
            <button class="btn-limpiar" onclick="limpiarHistorial()">Limpiar Historial</button>
            <div class="credito">
                Created by <span>DualLAK7</span>
            </div>
        </div>
    </div>

    <script>
        let tasaOficialUSD = 0;
        let tasaOficialEUR = 0;
        
        let historial = JSON.parse(localStorage.getItem('historialCalculos')) || [];

        function formatearMonedaTruncada(numero) {
            const truncado = Math.trunc((numero + 0.000001) * 100) / 100;
            return truncado.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatearTasa(numero) {
            return numero.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
        }

        async function obtenerTasas() {
            // Sistema de redundancia: Intenta cargar APIs en orden de prioridad
            const apis = [
                {
                    // Opción 1: PyDolarVenezuela (Actualiza casi en tiempo real con el BCV)
                    url: 'https://pydolarvenezuela-api.vercel.app/api/v1/dollar?page=bcv',
                    extraer: (datos) => {
                        return { usd: datos.monitors.usd.price, eur: datos.monitors.eur.price };
                    }
                },
                {
                    // Opción 2: DolarApi (Servidor de respaldo por si el primero está caído)
                    url: 'https://ve.dolarapi.com/v1/cotizaciones',
                    extraer: (datos) => {
                        const dataUSD = datos.find(d => d.moneda === 'USD' || d.nombre.includes('Dólar'));
                        const dataEUR = datos.find(d => d.moneda === 'EUR' || d.nombre.includes('Euro'));
                        return { usd: dataUSD ? dataUSD.promedio : 0, eur: dataEUR ? dataEUR.promedio : 0 };
                    }
                }
            ];

            let tasasCargadas = false;

            for (let api of apis) {
                try {
                    const respuesta = await fetch(api.url);
                    if (!respuesta.ok) continue; // Si la conexión falla, intenta con la siguiente API
                    
                    const datos = await respuesta.json();
                    const tasas = api.extraer(datos);
                    
                    if (tasas.usd > 0 && tasas.eur > 0) {
                        // Escudo matemático anti-bugs de miles
                        tasaOficialUSD = (tasas.usd < 100) ? tasas.usd * 1000 : tasas.usd;
                        tasaOficialEUR = (tasas.eur < 100) ? tasas.eur * 1000 : tasas.eur;

                        document.getElementById('tasas-info').innerHTML = 
                            `🎃 USD: <b>${formatearTasa(tasaOficialUSD)} VES</b> <br> 👻 EUR: <b>${formatearTasa(tasaOficialEUR)} VES</b>`;
                        
                        tasasCargadas = true;
                        break; // Detiene la búsqueda al conseguir los datos con éxito
                    }
                } catch (error) {
                    console.log(`Fallo silencioso al conectar con ${api.url}`);
                }
            }

            if (!tasasCargadas) {
                document.getElementById('tasas-info').innerHTML = "No se pudieron cargar las tasas. Verifica tu conexión a internet.";
            }
        }

        function actualizarInterfaz() {
            const modo = document.getElementById('modo-calculo').value;
            const labelMonto = document.getElementById('label-monto');
            const btnCalcular = document.getElementById('btn-calcular');
            const contenedorSelector = document.getElementById('contenedor-selector-tasa');
            const contenedorCustom = document.getElementById('contenedor-custom');
            const labelCustom = document.getElementById('label-custom');
            const appContainer = document.getElementById('app-container');

            document.getElementById('monto').value = '';

            if (modo === 'multiplicar') {
                appContainer.className = 'app-container tema-multiplicar';
                labelMonto.innerText = "Monto a calcular (en Divisas):";
                btnCalcular.innerText = "Calcular Bolívares";
                contenedorSelector.style.display = 'block';
                document.getElementById('resultado').innerHTML = "0,00 VES";
                labelCustom.innerText = "Ingrese su tasa (VES):";
                gestionarTasaPersonalizada(); 
            } else {
                appContainer.className = 'app-container tema-dividir';
                labelMonto.innerText = "Monto en Bolívares (VES):";
                btnCalcular.innerText = "Convertir a Divisas";
                contenedorSelector.style.display = 'none';
                contenedorCustom.style.display = 'block'; 
                labelCustom.innerText = "Tasa Manual Opcional (VES):";
                document.getElementById('resultado').innerHTML = "0,00";
            }
            document.getElementById('equivalencias').style.display = 'none';
        }

        function gestionarTasaPersonalizada() {
            if (document.getElementById('modo-calculo').value === 'dividir') return;
            const tipo = document.getElementById('tipo-tasa').value;
            const contenedorCustom = document.getElementById('contenedor-custom');
            contenedorCustom.style.display = (tipo === 'custom') ? 'block' : 'none';
        }

        function calcularTotal() {
            const modo = document.getElementById('modo-calculo').value;
            const monto = parseFloat(document.getElementById('monto').value);
            
            if (isNaN(monto) || monto <= 0) {
                alert("Por favor, ingrese un monto válido.");
                return;
            }

            if (modo === 'multiplicar') {
                const tipo = document.getElementById('tipo-tasa').value;
                let tasaAplicada = 0;
                let nombreTasa = "";

                if (tipo === 'usd') { tasaAplicada = tasaOficialUSD; nombreTasa = "USD"; }
                else if (tipo === 'eur') { tasaAplicada = tasaOficialEUR; nombreTasa = "EUR"; }
                else if (tipo === 'custom') {
                    tasaAplicada = parseFloat(document.getElementById('tasa-custom').value);
                    nombreTasa = "Manual";
                    if (isNaN(tasaAplicada) || tasaAplicada <= 0) {
                        alert("Por favor, ingrese una tasa personalizada válida.");
                        return;
                    }
                }

                if (tasaAplicada === 0) {
                    alert("Las tasas oficiales aún no han cargado.");
                    return;
                }

                const total = monto * tasaAplicada;
                const totalFormateado = formatearMonedaTruncada(total);
                document.getElementById('resultado').innerHTML = `<b>${totalFormateado}</b> VES`;

                let htmlEquivalencias = "Ese total equivale a:<br>";
                let mostrarEquivalencias = false;

                if (tipo !== 'usd' && tasaOficialUSD > 0) {
                    htmlEquivalencias += `🎃 USD BCV: <b>${formatearMonedaTruncada(total / tasaOficialUSD)}</b><br>`;
                    mostrarEquivalencias = true;
                }
                if (tipo !== 'eur' && tasaOficialEUR > 0) {
                    htmlEquivalencias += `👻 EUR BCV: <b>${formatearMonedaTruncada(total / tasaOficialEUR)}</b><br>`;
                    mostrarEquivalencias = true;
                }
                if (tipo !== 'custom') {
                    const tasaCustom = parseFloat(document.getElementById('tasa-custom').value);
                    if (!isNaN(tasaCustom) && tasaCustom > 0) {
                        htmlEquivalencias += `🦇 Tasa Manual: <b>${formatearMonedaTruncada(total / tasaCustom)}</b><br>`;
                        mostrarEquivalencias = true;
                    }
                }

                const divEq = document.getElementById('equivalencias');
                if (mostrarEquivalencias) {
                    divEq.innerHTML = htmlEquivalencias;
                    divEq.style.display = 'block';
                } else { divEq.style.display = 'none'; }

                guardarEnHistorial(modo, formatearMonedaTruncada(monto), nombreTasa, formatearTasa(tasaAplicada), totalFormateado);

            } else {
                let htmlEquivalencias = "Otras equivalencias:<br>";
                let mostrarEquivalencias = false;
                let principalMostrado = false;
                
                let mainTotal = "";
                let mainMoneda = "";
                let mainTasa = 0;

                const tasaCustomVal = parseFloat(document.getElementById('tasa-custom').value);

                if (tasaOficialUSD === 0 && tasaOficialEUR === 0 && (isNaN(tasaCustomVal) || tasaCustomVal <= 0)) {
                    alert("No hay tasas disponibles para calcular.");
                    return;
                }

                if (tasaOficialUSD > 0) {
                    const totalUSD = monto / tasaOficialUSD;
                    document.getElementById('resultado').innerHTML = `<b>${formatearMonedaTruncada(totalUSD)}</b> USD (BCV)`;
                    mainTotal = formatearMonedaTruncada(totalUSD);
                    mainMoneda = "USD";
                    mainTasa = tasaOficialUSD;
                    principalMostrado = true;
                }

                if (tasaOficialEUR > 0) {
                    const totalEUR = monto / tasaOficialEUR;
                    if (!principalMostrado) {
                        document.getElementById('resultado').innerHTML = `<b>${formatearMonedaTruncada(totalEUR)}</b> EUR (BCV)`;
                        mainTotal = formatearMonedaTruncada(totalEUR);
                        mainMoneda = "EUR";
                        mainTasa = tasaOficialEUR;
                        principalMostrado = true;
                    } else {
                        htmlEquivalencias += `👻 EUR BCV: <b>${formatearMonedaTruncada(totalEUR)}</b><br>`;
                        mostrarEquivalencias = true;
                    }
                }

                if (!isNaN(tasaCustomVal) && tasaCustomVal > 0) {
                    const totalCustom = monto / tasaCustomVal;
                    if (!principalMostrado) {
                        document.getElementById('resultado').innerHTML = `<b>${formatearMonedaTruncada(totalCustom)}</b> Manual`;
                        mainTotal = formatearMonedaTruncada(totalCustom);
                        mainMoneda = "Manual";
                        mainTasa = tasaCustomVal;
                    } else {
                        htmlEquivalencias += `🦇 Tasa Manual: <b>${formatearMonedaTruncada(totalCustom)}</b><br>`;
                        mostrarEquivalencias = true;
                    }
                }

                const divEq = document.getElementById('equivalencias');
                if (mostrarEquivalencias) {
                    divEq.innerHTML = htmlEquivalencias;
                    divEq.style.display = 'block';
                } else { divEq.style.display = 'none'; }

                guardarEnHistorial(modo, formatearMonedaTruncada(monto), mainMoneda, formatearTasa(mainTasa), mainTotal);
            }
        }

        function guardarEnHistorial(modo, monto, moneda, tasa, total) {
            historial.unshift({ modo, monto, moneda, tasa, total });
            if (historial.length > 15) historial.pop();
            localStorage.setItem('historialCalculos', JSON.stringify(historial));
            renderizarHistorial();
        }

        function renderizarHistorial() {
            const lista = document.getElementById('lista-historial');
            lista.innerHTML = '';
            
            historial.forEach(item => {
                const nuevoItem = document.createElement('li');
                const modoActual = item.modo || 'multiplicar';

                if (modoActual === 'multiplicar') {
                    nuevoItem.innerHTML = `
                        <span><b>${item.monto}</b> (${item.moneda}) x ${item.tasa}</span>
                        <span><b>${item.total}</b> VES</span>
                    `;
                } else {
                    nuevoItem.innerHTML = `
                        <span><b>${item.monto}</b> VES ÷ ${item.tasa}</span>
                        <span><b>${item.total}</b> ${item.moneda}</span>
                    `;
                }
                lista.appendChild(nuevoItem);
            });
        }

        function limpiarHistorial() {
            historial = [];
            localStorage.removeItem('historialCalculos');
            renderizarHistorial();
        }

        obtenerTasas();
        renderizarHistorial();
        actualizarInterfaz();
    </script>
</body>
</html>
