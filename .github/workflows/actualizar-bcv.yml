name: Actualizar Tasas BCV

on:
  schedule:
    # Se ejecuta a las 8:15 AM y cada hora de 3:15 PM a 7:15 PM (hora Venezuela)
    - cron: '15 12,19,20,21,22,23 * * *'
  workflow_dispatch: # Permite actualizarlo manualmente con un botón

permissions:
  contents: write

jobs:
  obtener-tasas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Leer tasas directo del BCV
        run: |
          python3 - << 'EOF'
          import urllib.request, ssl, re, json
          from datetime import datetime, timezone, timedelta

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          req = urllib.request.Request(
              'https://www.bcv.org.ve/',
              headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0'}
          )

          with urllib.request.urlopen(req, context=ctx, timeout=25) as resp:
              html = resp.read().decode('utf-8', errors='ignore')

          def extraer(moneda_id):
              m = re.search(rf'id="{moneda_id}".*?<strong>\s*([0-9.,]+)\s*</strong>', html, re.S)
              if not m:
                  return 0.0
              return float(m.group(1).replace('.', '').replace(',', '.'))

          usd = extraer('dolar')
          eur = extraer('euro')
          m_fecha = re.search(r'date-display-single[^>]*>([^<]+)<', html)
          fecha_valor = m_fecha.group(1).strip() if m_fecha else ''

          if usd > 0 and eur > 0:
              hora_ve = (datetime.now(timezone.utc) - timedelta(hours=4)).strftime('%d/%m/%Y %I:%M %p')
              datos = {
                  "usd": usd,
                  "eur": eur,
                  "fecha_valor": fecha_valor,
                  "actualizado": hora_ve
              }
              with open('tasas.json', 'w', encoding='utf-8') as f:
                  json.dump(datos, f, ensure_ascii=False, indent=2)
              print("Tasas guardadas:", datos)
          else:
              raise Exception("No se encontraron tasas válidas en el HTML del BCV")
          EOF

      - name: Guardar tasas.json si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasas.json
          git diff --staged --quiet || (git commit -m "Actualización automática BCV" && git push)
